<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tonka</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tonka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="apple-touch-icon" href="icon-t-180.png?v=2">
<link rel="icon" type="image/png" href="icon-t-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Màu nền trùng với nền app: iOS 26+ lấy màu nền trang để tô vùng thanh trạng thái */
  :root { --bg: #F2F1EE; --bar: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15120F; --bar: #201B17; } }
  html, body { margin: 0; height: 100%; width: 100%; background-color: var(--bg); overflow: hidden; touch-action: pan-y; overscroll-behavior: none; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; height: env(safe-area-inset-bottom, 0px); background: var(--bar); opacity: 0; transition: opacity .3s ease; }
  body.ready .bottom { opacity: 0; }
  /* App nằm sẵn phía sau màn logo và được vẽ đầy đủ từ trước, nên khi màn logo tan đi không có khung trống nào lộ ra */
  /* iPhone hay tự nới rộng khung theo nội dung: ép khung luôn đúng bề ngang màn hình */
  iframe { position: fixed; left: 0; right: 0; top: 0; width: 1px; min-width: 100%; max-width: 100%; height: 100%; border: 0; background: var(--bg);
           transform: scale(.965); transform-origin: 50% 45%; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  iframe.show { transform: none; }
  .splash { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: var(--bg);
            transition: opacity .5s cubic-bezier(.4, 0, .2, 1); will-change: opacity; }
  .splash img { width: min(72vw, 360px); height: auto; opacity: 0; transform: scale(.97); transition: opacity .7s ease, transform .9s cubic-bezier(.2, .8, .2, 1); will-change: opacity, transform; }
  .splash.in img { opacity: 1; transform: none; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .splash.gone img { opacity: 0; transform: scale(1.06); transition: opacity .4s ease, transform .5s cubic-bezier(.4, 0, .2, 1); }
  .reconn { position: fixed; left: 0; right: 0; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); z-index: 4; text-align: center; font: 15px/1.4 system-ui, -apple-system, sans-serif; color: #7a6d63; opacity: 0; transition: opacity .3s ease; pointer-events: none; }
  .reconn.on { opacity: 1; pointer-events: auto; }
  .reconn button { margin-top: 12px; font: 600 16px system-ui, -apple-system, sans-serif; padding: 12px 26px; border-radius: 12px; border: 0; background: #6B4430; color: #fff; display: none; }
  .reconn.slow button { display: inline-block; }
  @media (prefers-color-scheme: dark) { .reconn { color: #a99e94; } }
  .err { position: fixed; inset: 0; z-index: 3; display: none; padding: 32px 24px; font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #3d332c; background: #F2F1EE; }
  @media (prefers-reduced-motion: reduce) { .splash img, .splash, iframe, .bottom { transition: none !important; } iframe { transform: none; } }
</style>
</head>
<body>
<div class="splash" id="splash"><picture><source srcset="tonka-full-dark.png" media="(prefers-color-scheme: dark)"><img src="tonka-full-light.png" alt="tonka. good coffee in town"></picture></div>
<div class="bottom" aria-hidden="true"></div>
<div class="reconn" id="reconn"><div id="reconnText">Đang kết nối lại…</div><button id="retryBtn" type="button">Thử lại</button></div>
<div id="sabProbe" style="position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom, 0px);visibility:hidden;pointer-events:none"></div>
<div class="err" id="err">Chưa có link app. Mở file config.js và dán link Web app (kết thúc bằng /exec) vào giữa hai dấu nháy.</div>
<iframe id="app" title="Tonka Ca Làm" allow="clipboard-write"></iframe>
<script src="config.js"></script>
<script>
  var url = window.APP_URL || '';
  var sp = document.getElementById('splash'), f = document.getElementById('app');
  // Căn logo vào đúng giữa màn hình thật: khi mở từ màn hình chính, trang bắt đầu dưới thanh trạng thái
  try {
    var bar = window.navigator.standalone ? Math.max(0, Math.min(80, screen.height - window.innerHeight)) : 0;
    sp.style.paddingBottom = (bar + 12) + 'px';
  } catch (e) {}
  var MIN_SHOW = 1000, loaded = false, shown = false, t0 = Date.now();
  // logo hiện dần
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ sp.classList.add('in'); }); });
  function finish(){
    if (shown) return; shown = true;
    var wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
    setTimeout(function(){
      // một chuyển cảnh duy nhất: logo phóng nhẹ và tan, nền logo mờ dần, app phía sau phóng về đúng cỡ
      requestAnimationFrame(function(){
        sp.classList.add('gone'); f.classList.add('show'); document.body.classList.add('ready');
        var rcx = document.getElementById('reconn'); if (rcx) rcx.classList.remove('on', 'slow');
        setTimeout(function(){ sp.remove(); }, 700);
      });
    }, wait);
  }
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
    document.getElementById('err').style.display = 'block';
  } else {
    // Chờ app báo "đã vẽ xong" rồi mới bỏ màn logo, để chuyển cảnh một lần, không nháy
    // App chạy trong khung nên không tự biết khoảng vạch Home ở đáy máy: trang vỏ đo rồi gửi vào để menu dưới nằm sát mép
    var appWin = null, lastPong = Date.now(), pingT = null, slowT = null, reloading = false, hiddenAt = 0;
    var rc = document.getElementById('reconn'), rcText = document.getElementById('reconnText');
    function sendInsets(){ if (!appWin) return; var p = document.getElementById('sabProbe'); try { appWin.postMessage({tonka: 'insets', bottom: p ? p.offsetHeight : 0}, '*'); } catch (e) {} }
    function hideReconn(){ rc.classList.remove('on', 'slow'); clearTimeout(slowT); }
    // Tải lại app (khi app bên trong không phản hồi, mất kết nối, hoặc mở lần đầu quá lâu)
    function reloadApp(why){
      if (reloading) return; reloading = true; appWin = null;
      if (!document.getElementById('splash')) {
        var s2 = document.createElement('div'); s2.className = 'splash in'; s2.id = 'splash';
        s2.innerHTML = '<picture><source srcset="tonka-full-dark.png" media="(prefers-color-scheme: dark)"><img src="tonka-full-light.png" alt="tonka."></picture>';
        document.body.appendChild(s2); sp = s2; shown = false; t0 = Date.now();
      }
      rcText.textContent = 'Đang kết nối lại…'; rc.classList.add('on');
      clearTimeout(slowT); slowT = setTimeout(function(){ rcText.textContent = 'Mạng chậm hoặc máy chủ đang bận.'; rc.classList.add('slow'); }, 20000);
      f.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now();
      setTimeout(function(){ reloading = false; }, 3000);
    }
    document.getElementById('retryBtn').addEventListener('click', function(){ reloading = false; reloadApp('nút'); });
    window.addEventListener('message', function(e){
      if (e.data === 'tonka-ready') { appWin = e.source; lastPong = Date.now(); sendInsets(); hideReconn(); finish(); }
      else if (e.data === 'tonka-pong') { lastPong = Date.now(); clearTimeout(pingT); }
      else if (e.data === 'tonka-reload') { reloadApp('app báo lỗi'); }
    });
    window.addEventListener('resize', sendInsets);
    // Mở lại app sau một lúc: hỏi thăm app bên trong, 3 giây không trả lời thì tải lại
    function checkAlive(){
      if (!appWin) { reloadApp('chưa sẵn sàng'); return; }
      try { appWin.postMessage('tonka-ping', '*'); } catch (e) { reloadApp('lỗi gửi'); return; }
      clearTimeout(pingT); pingT = setTimeout(function(){ reloadApp('không phản hồi'); }, 3000);
    }
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 20000) checkAlive();
    });
    window.addEventListener('pageshow', function(e){ if (e.persisted) checkAlive(); });
    f.addEventListener('load', function(){ loaded = true; setTimeout(finish, 5000); });  // dự phòng nếu không nhận được tin
    // Lần mở đầu: 20 giây vẫn chưa vào được thì tự thử lại một lần và hiện nút Thử lại
    setTimeout(function(){ if (!appWin) { reloadApp('mở lâu'); } }, 20000);
    f.src = url;
  }
</script>
</body>
</html>
