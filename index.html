<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tonka</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tonka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-t-180.png?v=2">
<link rel="icon" type="image/png" href="icon-t-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>html{background:var(--bg,#F2F1EE)}html,body{overscroll-behavior:none}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column phone app, sticky header, content list, fixed bottom tab bar. */
:root{
  --bg:#F2F1EE; --surface:#FFFFFF; --line:#E2DED8; --fg:#221C18; --muted:#6E655E;
  --accent:#6B4430; --accent-soft:#EFE4DC; --on-accent:#FFFFFF;
  --ok:#2F7A4F; --ok-soft:#E1F0E6; --warn:#A5620B; --warn-soft:#FBEBD2; --bad:#B23A2E; --bad-soft:#F7E0DC;
  --tg:#1F7FB8; --tg-soft:#E2EFF7;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --surface:#201B17; --line:#342C26; --fg:#F1EBE5; --muted:#A99E94;
  --accent:#D9A67E; --accent-soft:#3A2B21; --on-accent:#1B1310;
  --ok:#6FC08F; --ok-soft:#1D3326; --warn:#E4A650; --warn-soft:#3A2A14; --bad:#EE8A7E; --bad-soft:#3D1F1B; --tg:#6CC0EE; --tg-soft:#172A36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120F; --surface:#201B17; --line:#342C26; --fg:#F1EBE5; --muted:#A99E94;
  --accent:#D9A67E; --accent-soft:#3A2B21; --on-accent:#1B1310;
  --ok:#6FC08F; --ok-soft:#1D3326; --warn:#E4A650; --warn-soft:#3A2A14; --bad:#EE8A7E; --bad-soft:#3D1F1B; --tg:#6CC0EE; --tg-soft:#172A36; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.mono-t{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none;letter-spacing:-.02em}
.head .who{min-width:0;flex:1}
.head h1{font-size:17px;font-weight:700;margin:0;line-height:1.2}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
main{flex:1;padding:16px 16px calc(96px + var(--sab,env(safe-area-inset-bottom,0px)));display:flex;flex-direction:column;gap:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.shift{display:flex;flex-direction:column;gap:10px}
.shift-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.shift-top strong{font-size:20px;font-weight:800;letter-spacing:-.01em}
.time{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.ok i{background:var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.handover{background:var(--warn-soft);border:1px solid transparent;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.handover .label{color:var(--warn)}
.handover ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.seg{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-family:var(--mono);font-size:11px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tasks{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:14px;text-align:left;width:100%;border-bottom:1px solid var(--line);min-height:56px}
.task:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.task.done .box{background:var(--ok);border-color:var(--ok)}
.box svg{width:16px;height:16px;opacity:0}
.task.done .box svg{opacity:1}
.tbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.tt{font-weight:500}
.task.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.tn{font-size:13px;color:var(--muted)}
.tn code{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--fg);padding:1px 5px;border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.late{background:var(--bad-soft);color:var(--bad)}
.chip.must{background:var(--warn-soft);color:var(--warn);font-family:var(--font)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sab,env(safe-area-inset-bottom,0px)))}
.nav div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.note{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .by{font-size:12.5px;color:var(--muted)}
.compose{display:flex;flex-direction:column;gap:8px}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px;box-sizing:border-box}
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;padding:12px 16px;border-radius:12px;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.week{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day{display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .d{width:44px;flex:none;display:flex;flex-direction:column;align-items:center}
.day .d b{font-size:18px;font-variant-numeric:tabular-nums}
.day .d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day.today{background:var(--accent-soft)}
.day .s{min-width:0;flex:1}
.day .off{color:var(--muted)}
/* login */
.login{flex:1;display:flex;flex-direction:column;gap:18px;padding:28px 16px 32px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.brand .mono-t{width:64px;height:64px;font-size:36px}
.brand h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:14px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:1px}
.person b{font-weight:700}
.person span{font-size:12.5px;color:var(--muted)}
.person[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.person.locked{opacity:.5}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.pad button{height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:600;font-family:var(--mono)}
.pad button.blank{visibility:hidden}
.msg{min-height:20px;font-size:13.5px;text-align:center;color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);text-align:center}
/* manager */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.row .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row .info b{font-weight:600}
.row .info span{font-size:12.5px;color:var(--muted)}
.pct{font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.toggle{font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;border:1px solid var(--line)}
.toggle.lock{color:var(--bad);border-color:var(--bad)}
.toggle.unlock{color:var(--ok);border-color:var(--ok)}
.confirm{background:var(--bad-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.confirm .acts{display:flex;gap:8px}
.confirm .acts .btn{flex:1;padding:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab,env(safe-area-inset-bottom,0px)));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
.tpl summary{padding:12px 14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.tpl summary span{font-size:12.5px;color:var(--muted);font-weight:500}
.tpl ol{margin:0;padding:0 14px 12px 34px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.tpl{border-bottom:1px solid var(--line)}
.tpl:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* đổi ca, xếp ca, telegram */
.day{width:100%;text-align:left}
.day:disabled{opacity:.5;cursor:default}
.day .s{display:flex;flex-direction:column;gap:3px}
.chev{font-size:22px;color:var(--muted);flex:none}
.ic{position:relative;display:inline-flex}
.badge{position:absolute;top:-4px;right:-10px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.daybar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.daybar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:9px;color:var(--muted)}
.daybar button span{font-size:11px;font-weight:600}
.daybar button b{font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.daybar button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.daybar button[aria-pressed="true"] b{color:var(--on-accent)}
.dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.slot{display:flex;flex-direction:column;gap:10px}
.person-chip{font-family:var(--font);font-size:13px;padding:4px 10px}
.warn-line{font-size:13px;color:var(--warn);font-weight:500}
.twobtn{display:flex;gap:8px}
.twobtn .btn{flex:1}
.sheet-bg{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;box-sizing:border-box;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--sab,env(safe-area-inset-bottom,0px)));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet>*{flex:none}
.sheet h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt:last-child{border-bottom:0}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .box svg{opacity:1}
.box.radio{border-radius:50%}
.req{background:var(--surface)}
.xlist{display:flex;flex-direction:column;gap:8px}
.xrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.xrow>span:first-child{min-width:0}
.xrow .chip{flex:none;font-family:var(--font)}
.tfield{flex:1;display:flex;flex-direction:column;gap:6px}
.tfield input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-family:var(--mono);font-size:16px}
.tpl summary .sum-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.tpl summary .sum-l span{font-size:12.5px;color:var(--muted);font-weight:500}
.tpl summary .pct{font-size:15px;color:var(--fg);font-weight:700;flex:none}
.tpl summary .sum-l b{font-size:15px;color:var(--fg);font-weight:600}
.log{display:flex;flex-direction:column;padding:0 14px 12px}
.log div{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.slip{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--tg-soft);border-radius:4px 14px 14px 14px;padding:12px}
.payrow{width:100%;text-align:left}
.payedit{display:flex;flex-direction:column;gap:10px;padding:4px 14px 14px;border-bottom:1px solid var(--line)}
.tfield input[type="text"]{font-family:var(--font);font-size:15px}
.seg button[data-exmul]{font-family:var(--mono)}
label.btn{cursor:pointer}

/* bổ sung cho bản chính thức */
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
.busybar{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-50% 0}to{background-position:150% 0}}
a.btn{display:block;text-decoration:none}
.tfield{min-width:0}
.tfield input{width:100%;box-sizing:border-box;min-width:0}
.linkbtn{color:var(--accent);font-size:12.5px;font-weight:600;padding:2px 0;text-decoration:underline;text-underline-offset:2px}
.xr{display:flex;align-items:center;gap:8px;flex:none}
.rowacts{display:flex;gap:12px}
.slipcard summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;list-style:none}
.slipcard summary::-webkit-details-marker{display:none}
.slipcard[open] summary{margin-bottom:10px}
.head .out{flex:none}
@media (prefers-reduced-motion:reduce){.busybar{animation:none;background:var(--accent)}}
.box.cam{color:var(--muted);border-style:dashed}
.box.cam svg{opacity:1;width:17px;height:17px}
.task.done .box.cam{border-style:solid}
img.photo{width:100%;border-radius:12px;display:block;background:var(--accent-soft)}
.est{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.est span{font-size:13px;color:var(--muted)}
.est b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.fund{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fund div{display:flex;flex-direction:column;gap:2px;min-width:0}
.fund b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.bar2{position:relative;height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar2 .pj{background:var(--accent);opacity:.35}
.bar2 .pj.over{background:var(--bad);opacity:.45}
.bar2 .sp{background:var(--accent);z-index:1}
.chipbtn{cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.chip.txt{font-family:var(--font);font-size:12px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.leftlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:14px}
img.mono-t.logo{object-fit:contain;background:var(--surface);border:1px solid var(--line)}
.brand img.mono-t.logo{width:72px;height:72px}
.seg{overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{min-width:0}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.trow{align-items:flex-start;cursor:default}
.tacts{display:flex;gap:4px;flex:none;align-items:center}
.ibtn{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;color:var(--fg)}
.ibtn.txt{font-size:13px;padding:0 10px;color:var(--accent)}
.ibtn:disabled{opacity:.3}
.asg .task{border-left:3px solid var(--accent)}
.danger-link{color:var(--bad);align-self:flex-start}
.card0{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card0 .label{padding:8px 14px 0}
.trow .tbody{flex:1;min-width:0}
.trow .tacts .ibtn{min-width:30px;height:32px;padding:0}
.trow .tacts .ibtn.txt{padding:0 8px}
.trow{box-sizing:border-box}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.task.soon{opacity:.55}
.task.missed .tt{color:var(--muted)}
.busy-bg{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(30,20,14,.28);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:bfade .15s ease-out}
.busy-bg[hidden]{display:none}
.busy-card{background:var(--surface);border-radius:20px;padding:18px 26px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-width:78vw}
.busy-card p{margin:0;font-weight:700;font-size:15px;text-align:center;color:var(--fg)}
.espresso{width:104px;height:104px}
.espresso .m-body{fill:var(--accent)}
.espresso .m-dark{fill:var(--fg)}
.espresso .m-light{fill:#f4c76b;animation:blink 1.2s ease-in-out infinite}
.espresso .stream{stroke:#6b3a1e;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:5 4;animation:pour .45s linear infinite,flow 7s linear infinite}
.espresso .coffee{fill:#6b3a1e;animation:fillup 7s linear infinite}
.espresso .cup{fill:none;stroke:var(--fg);stroke-width:2.6;stroke-linejoin:round}
.espresso .saucer{fill:var(--fg)}
.espresso .steam{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:0;animation:steam 7s ease-in-out infinite}
.espresso .s2{animation-delay:.2s}
@keyframes bfade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes pour{to{stroke-dashoffset:-9}}
@keyframes flow{0%,6%{opacity:0}9%,78%{opacity:1}83%,100%{opacity:0}}
@keyframes fillup{0%,8%{transform:translateY(0)}80%,95%{transform:translateY(-21px)}100%{transform:translateY(0)}}
@keyframes steam{0%,79%{opacity:0;transform:translateY(4px)}88%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.espresso *{animation:none!important}.espresso .coffee{transform:translateY(-14px)}.espresso .steam{opacity:0}}
.btn:active,.task:active,.opt:active,.seg button:active,.pills button:active,.ibtn:active{transform:scale(.97)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;min-height:0;overflow:hidden}
.head{position:relative;top:auto;flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;display:flex;flex-direction:column}
.scroll>main{flex:none;padding-bottom:24px}
.nav{position:relative;flex:none;bottom:auto}
input,textarea,select,input[type="text"]{font-size:16px}
.tfield input,.tfield input[type="text"],.sheet input,.sheet textarea,.app textarea{font-size:16px}
/* iPhone: không cho kéo ngang, không cho phần tử nào rộng quá màn hình */
html,body,.app{max-width:100vw;overflow-x:hidden;touch-action:pan-y}
.scroll,.sheet{overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain}
.sheet>*,.scroll main>*{max-width:100%;min-width:0;box-sizing:border-box}
input,textarea,select{max-width:100%;min-width:0;box-sizing:border-box}
input[type="time"],input[type="date"],input[type="number"]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;min-height:44px;text-align:left}
input[type="time"]::-webkit-date-and-time-value,input[type="date"]::-webkit-date-and-time-value{text-align:left}
input::placeholder{text-overflow:ellipsis}
.shot{display:flex;align-items:center;gap:14px;font-family:var(--mono);color:var(--fg);margin-top:2px}
.shot span{font-size:13px;color:var(--muted)}
.shot b{font-size:22px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;display:inline-block;min-width:2.6ch;text-align:right}
.shot-sep{width:1px;height:18px;background:var(--line)}
.shot.done b{color:var(--ok)}
.busy-card .shot-ref{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:6px}
#busyText{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.busy-card .shot-ref{margin-bottom:0}
.espresso .m-word{fill:var(--on-accent)}
.logo-btn{padding:0;border:0;background:none;border-radius:50%;flex:none;line-height:0}
.logo-btn:active{transform:scale(.94)}
.steam-pill{position:fixed;left:50%;bottom:calc(84px + var(--sab,env(safe-area-inset-bottom,0px)));transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);padding:7px 14px 7px 10px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:pillIn .2s ease-out}
.steam-pill[hidden]{display:none}
.steam-pill svg{width:26px;height:26px;overflow:visible}
.steam-pill .sp-cup{fill:var(--bg)}
.steam-pill .sp-h{fill:none;stroke:var(--bg);stroke-width:1.8;stroke-linecap:round}
.steam-pill .sp-s{fill:none;stroke:var(--bg);stroke-width:1.6;stroke-linecap:round;opacity:0;animation:steamUp 2.4s ease-in-out infinite}
.steam-pill .s2{animation-delay:.8s}.steam-pill .s3{animation-delay:1.6s}
@keyframes steamUp{0%{opacity:0;transform:translateY(3px)}30%{opacity:.9}100%{opacity:0;transform:translateY(-5px)}}
@keyframes pillIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
.is-busy{position:relative;pointer-events:none;color:transparent!important}
.is-busy *{visibility:hidden}
.is-busy::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .7s linear infinite;visibility:visible}
.btn.is-busy:not(.ghost)::after{border-color:var(--on-accent);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steam-pill .sp-s{animation:none;opacity:.7}.is-busy::after{animation-duration:2s}}
/* Ô chọn (tick): giữ nguyên chữ khi đang lưu, chỉ mờ nhẹ và có vòng xoay nhỏ bên phải */
.opt.is-busy,.task.is-busy,.pills button.is-busy,.seg button.is-busy{color:inherit!important;opacity:.7}
.opt.is-busy *,.task.is-busy *,.pills button.is-busy *,.seg button.is-busy *{visibility:visible}
.opt.is-busy::after,.task.is-busy::after{left:auto;right:16px;width:14px;height:14px;margin-left:0;margin-top:-7px}
.pills button.is-busy::after,.seg button.is-busy::after{display:none}
.opt.is-busy .box{visibility:hidden}
.opt.is-busy::after{right:auto;left:28px;width:16px;height:16px;margin-top:-8px}
.ho-card{gap:10px;border-left:3px solid var(--warn)}
.ho-one{display:flex;flex-direction:column;gap:4px}
.ho-lines{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14.5px}
.ho-ok{margin:0;font-size:13px;color:var(--muted)}
.ho-cta{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border-color:transparent}
.ho-cta span{font-size:14px}
.more-btn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--accent);font-size:14px}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.ho-okbtn{border-style:dashed}
.card.shift .shift-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chkset{gap:10px}
.ckrow{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ckrow .twobtn{align-items:flex-end}
.ckrow .seg{height:44px;box-sizing:border-box;padding:3px;align-items:stretch}
.ckrow .seg button{padding:0 4px;justify-content:center;flex-direction:row}
.ckrow .ibtn{height:44px;width:44px;flex:none}
.ckrow .tfield input{height:44px;box-sizing:border-box;padding-top:0;padding-bottom:0}
.ho-lines .chip{display:inline-block;white-space:nowrap;font-size:12px;line-height:18px;padding:0 7px;margin-left:4px;vertical-align:1px;border-radius:9px}
.logo-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo-row .mono-t{width:56px;height:56px;font-size:30px}
.ho-warn{margin:0;padding:10px 12px;border-radius:12px;background:var(--warn-bg,rgba(200,120,0,.1));color:var(--fg);font-size:14px}.ho-task .tt{font-weight:700}.more-btn.ho-hist{margin-top:4px}
.task .tbody{min-width:0}.task .tt{overflow-wrap:anywhere}
.left-row .chips{align-items:center}
.ho-card{display:flex;flex-direction:column;gap:12px}.ho-one{gap:8px}.ho-one+.ho-one{border-top:1px dashed var(--line);padding-top:12px}.ho-who{display:flex;align-items:center;gap:10px;font-size:15px}.ho-who>span:last-child{display:flex;flex-direction:column;line-height:1.3}.ho-av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;flex:none}.ho-sub{margin:2px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.ho-todos{display:flex;flex-direction:column;gap:8px}.ho-todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.ho-todo .tbody{display:flex;flex-direction:column;gap:2px;min-width:0}.ho-todo.done .box{background:var(--ok);border-color:var(--ok)}.ho-todo.done .tt{text-decoration:line-through;color:var(--muted)}.ho-ackbtn{width:100%}.ho-note{margin:-4px 0 0}
.btn.ho-open{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}.btn.ho-open .tn{font-weight:500;font-size:13px}
.chkset .twobtn{align-items:flex-end}.chkset .tfield .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-box{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}.pin-box .linkbtn{align-self:flex-start}.pin-who{margin:0;font-size:18px}.pin-field{position:relative;display:flex;justify-content:center;padding:14px 22px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:text}.pin-field .dots{gap:18px}.pin-field .dots i{width:16px;height:16px}#pinIn{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent}.pin-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}

.confirm .acts .btn{min-height:48px;box-sizing:border-box}

.ho-todo.other .box{display:none}
.ho-todo.free{align-items:center}.ho-todo .tbody{flex:1}.ho-claim{flex:none;white-space:nowrap}.card.shift .shift-top{flex-wrap:wrap;align-items:baseline}.card.shift .shift-top strong{flex:1 1 auto;min-width:0}.card.shift .shift-top .time{white-space:nowrap;margin-left:auto}
.task.left-row{align-items:center}.task .tn{overflow-wrap:anywhere}.left-row .left-tag{font-weight:600;color:var(--accent)}.left-row.free .left-tag{color:var(--muted)}
.task{box-sizing:border-box}
.task.left-row:not(.free){align-items:flex-start}
.box.box-gap{visibility:hidden}
.on-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#2FB45A;box-shadow:0 0 0 2px var(--surface),0 0 0 3px rgba(47,180,90,.35);margin-right:8px;vertical-align:2px}

  var el = $('#busy');

        headers: {'Content-Type': 'text/plain;charset=utf-8'}, redirect: 'follow', signal: ctl ? ctl.signal : undefined})

        function(e){ throw new Error(e && e.name === 'AbortError' ? 'NET_TIMEOUT' : 'NetworkError ' + ((e && e.message) || '')); })
      .then(function(o){ clearTimeout(t); if (!o || !o.ok) throw new Error((o && o.err) || 'Lỗi máy chủ'); return o.v; },

// lỗi mạng / hết thời gian (thường gặp khi app để lâu không dùng) → thử lại 1 lần, vẫn lỗi thì nhờ trang vỏ tải lại app

    if (!isNetErr(e)) throw e;

      if (DIRECT) { setTimeout(refresh, 3000); throw new Error('Mất kết nối với máy chủ. Kiểm tra mạng; app sẽ tự làm mới để bạn xem thao tác vừa rồi đã lưu chưa.'); }

/* "Việc của tôi": gộp việc ca trước, việc được giao, checklist; chỉ hiện vài việc cần làm ngay */

function chkCard(){

function weekStart(){ return addDays(D.mon, S.weekOff * 7); }
function slotIssues(date, k){
  var ids = (D.sched[date] || {})[k] || [], out = [];
  var hasMin = D.shifts[k].ranges.length === 1; // ca gãy không bắt buộc đủ vị trí
  if (hasMin) {
    if (!ids.some(function(id){ return person(id).role === 'pc'; })) out.push('Thiếu pha chế');
    if (!ids.some(function(id){ return person(id).role === 'pv'; })) out.push('Thiếu phục vụ');
  }
  ids.forEach(function(id){
    var nm = person(id).name;
    var other = D.order.filter(function(o){ return o !== k && overlap(o, k) && ((D.sched[date] || {})[o] || []).indexOf(id) >= 0; });
    if (other.length) out.push(nm + ' bị trùng giờ ' + sname(other[0]).toLowerCase());
    if (busyOn(id, date)) out.push(nm + ' đã báo bận');
    if (!person(id).active) out.push(nm + ' đã bị khoá');
  });
  return out;
}
function weekHours(id, start){
  var h = 0, n = 0, x = 0;
  for (var i = 0; i < 7; i++) {
    var d = addDays(start, i);
    shiftsOn(id, d).forEach(function(k){ h += D.shifts[k].hours; n++; });
    D.extras.forEach(function(e){ if (e.sid === id && e.date === d && e.status === 'ok') { h += (toMin(e.end) - toMin(e.start)) / 60; x++; } });
  }
  return {h: Math.round(h * 10) / 10, n: n, x: x};
}

var DAYS7 = ['T2','T3','T4','T5','T6','T7','CN'];
function daysOf(spec){ spec = String(spec || '').toUpperCase(); return DAYS7.filter(function(d){ return new RegExp('(^|[^A-Z0-9])' + d + '($|[^A-Z0-9])').test(spec); }); }
function daysText(spec){ var d = daysOf(spec); return d.length && d.length < 7 ? d.join(', ') : ''; }
function tplRowsFor(role, shift){ return (D.tplRows || []).filter(function(r){ return r.role === role && r.shift === shift; }); }
function tplPhases(rows){ var out = []; rows.forEach(function(r){ var p = out.find(function(x){ return x.phase === r.phase; }); if (!p) { p = {phase: r.phase, items: []}; out.push(p); } p.items.push(r); }); return out; }

function giveSheet(){

// ---------- sự kiện ----------
document.addEventListener('click', function(e){
  if (e.target.classList && e.target.classList.contains('sheet-bg')) { S.sheet = null; render(); return; }
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  LAST_BTN = b; LAST_BTN_AT = Date.now();
  var ds = b.dataset;
  // đăng nhập
  if (ds.pick) { var p = S.people.find(function(x){ return x.id === ds.pick; });
    if (!p.active) { S.pick = null; S.msg = 'Tài khoản ' + p.name + ' đã bị khoá. Liên hệ quản lý.'; } else { S.pick = ds.pick; S.pin = ''; S.msg = ''; }
    render(); var sc = document.getElementById('scroller'); if (sc) sc.scrollTop = 0; pinFocus(); return; }
  if (ds.act === 'repick') { S.pick = null; S.pin = ''; S.msg = ''; render(); return; }
  if (ds.key) {
    if (S.busy) return;
    if (ds.key === '⌫') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += ds.key;
    render();

setInterval(function(){ if (!document.hidden) refresh(); }, 60000);
setInterval(function(){ if (D && !S.sheet && (S.view === 'today' || S.view === 'team')) { var a = document.activeElement; if (!(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); } }, 30000);

// ---------- khởi động ----------
(function start(){
  if (!window.__LOGO__ && !(DIRECT && (function(){ try { return localStorage.getItem('tonka_logo_v') != null; } catch (e) { return false; } })())) loadLogo();
  if (TOK) {
    S.booting = true;
    try { var cs = JSON.parse(localStorage.getItem('tonka_state') || 'null'); if (cs && cs.tok === TOK && cs.st && Date.now() - cs.at < 3 * 86400000) setState(cs.st, cs.at); } catch (e) {}
    render();
    api('refresh', TOK).then(function(r){ S.booting = false; setState(r.state); render(); }).catch(function(){ storeTok(null); loadPeople(); });
  } else loadPeople();
})();

</script>
