<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonka</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tonka">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEEADE" id="themeColor">
<link rel="apple-touch-icon" href="icon-t-180.png">
<link rel="icon" type="image/png" href="icon-t-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg: #EEEADE; --bar: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bar: #15120F; } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body.ready { background: var(--bar); }
  iframe { position: fixed; left: 0; right: 0; top: 0; width: 100%; height: calc(100% - env(safe-area-inset-bottom, 0px)); border: 0; background: var(--bg); opacity: 0; transition: opacity .5s ease; }
  iframe.show { opacity: 1; }
  .splash { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: opacity .5s ease; }
  .splash img { width: min(72vw, 360px); height: auto; opacity: 0; transform: translateY(6px); transition: opacity 1s ease, transform 1s ease; }
  .splash.in img { opacity: 1; transform: none; }
  .splash.out img { opacity: 0; transform: translateY(-4px); transition-duration: .8s; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .err { position: fixed; inset: 0; z-index: 3; display: none; padding: 32px 24px; font: 16px/1.5 system-ui, -apple-system, sans-serif; color: #3d332c; background: var(--bg); }
  @media (prefers-reduced-motion: reduce) { .splash img, .splash, iframe { transition: none; } }
</style>
</head>
<body>
<div class="splash" id="splash"><img src="tonka-full.png" alt="tonka. good coffee in town"></div>
<div class="err" id="err">Chưa có link app. Mở file config.js và dán link Web app (kết thúc bằng /exec) vào giữa hai dấu nháy.</div>
<iframe id="app" title="Tonka Ca Làm" allow="clipboard-write"></iframe>
<script>
  // Thanh trên cùng đổi màu theo chế độ sáng/tối của máy (đổi ngay cả khi app đang mở)
  (function(){
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function apply(){
      var dark = mq && mq.matches, c = dark ? '#15120F' : '#EEEADE';
      var old = document.getElementById('themeColor');
      var m = document.createElement('meta'); m.name = 'theme-color'; m.id = 'themeColor'; m.content = c;
      if (old) old.parentNode.replaceChild(m, old); else document.head.appendChild(m);
      document.documentElement.style.background = c;
    }
    apply();
    if (mq) { if (mq.addEventListener) mq.addEventListener('change', apply); else if (mq.addListener) mq.addListener(apply); }
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) apply(); });
  })();
</script>
<script src="config.js"></script>
<script>
  var url = window.APP_URL || '';
  var sp = document.getElementById('splash'), f = document.getElementById('app');
  // Căn logo vào đúng giữa màn hình thật: khi mở từ màn hình chính, trang bắt đầu dưới thanh trạng thái
  try {
    var bar = window.navigator.standalone ? Math.max(0, Math.min(80, screen.height - window.innerHeight)) : 0;
    sp.style.paddingBottom = (bar + 12) + 'px';
  } catch (e) {}
  var MIN_SHOW = 1800, loaded = false, shown = false, t0 = Date.now();
  // logo hiện dần
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ sp.classList.add('in'); }); });
  function finish(){
    if (shown) return; shown = true;
    var wait = Math.max(0, MIN_SHOW - (Date.now() - t0));
    setTimeout(function(){
      sp.classList.add('out');                       // logo mờ dần
      setTimeout(function(){
        sp.classList.add('gone'); f.classList.add('show'); document.body.classList.add('ready');
        setTimeout(function(){ sp.remove(); }, 600);
      }, 800);
    }, wait);
  }
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
    document.getElementById('err').style.display = 'block';
  } else {
    f.addEventListener('load', function(){ loaded = true; finish(); });
    setTimeout(finish, 9000);                        // mạng chậm vẫn vào app
    f.src = url;
  }
</script>
</body>
</html>
